<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F4F2" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Benthic</title>
    <!-- The cascade layer order, first in the document: the build links the shared chunk's CSS (which only holds
         bc.components) before the main CSS, and the first stylesheet to name a layer would put it lowest, under
         Framework7. Same list as at the top of src/theme.css. -->
    <style>
      @layer framework7, maplibre, bc.tokens, bc.base, bc.components;
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
