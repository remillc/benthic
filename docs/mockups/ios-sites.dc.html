<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
// Positions réelles (fichiers d'exemple de Subsurface), projetées sur la zone visible de la carte.
var SITES = [
  { name: 'Northern Arch', lat: -35.4485, lon: 174.732, n: 1 },
  { name: 'Lake Coleridge', lat: -43.342295, lon: 171.545936, n: 1 }
];
function wp(lat, lon) { var n = 64 * 256, s = Math.sin(lat * Math.PI / 180); return [(lon + 180) / 360 * n, (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n]; }
// Carte réelle : tuiles OpenStreetMap au zoom 6, coin haut gauche (15557, 9444).
function px(lon) { return Math.round((wp(0, lon)[0] - 15557) * 0.4); }
function py(lat) { return Math.round((wp(lat, 0)[1] - 9444) * 0.4) + (-10); }
class Component extends DCLogic {
  renderVals() {
    return {
      pins: SITES.map(function (s) { var x = px(s.lon), y = py(s.lat); return { name: s.name, x: x, y: y, lx: x + 18, ly: y - 20, n: s.n }; }),
      sites: [
        { name: 'Northern Arch', hint: '1 plongée, le 2022-04-24', max: '198 pi' },
        { name: 'Lake Coleridge', hint: '1 plongée, le 2014-04-02', max: '128 pi' },
        { name: 'Hälvälä', hint: '1 plongée, pas de position GPS', max: '261 pi' }
      ]
    };
  }
}
</script>
