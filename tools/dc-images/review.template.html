<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Images des ordinateurs de plongée</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,sans-serif;color:#1f2124;background:#f4f5f6}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:10px 16px;background:#14304f;color:#fff}
header h1{font-size:16px;margin:0;flex:1}header input{padding:6px 8px;border-radius:6px;border:0;min-width:220px}
button{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid #1f2124;background:#1f2124;color:#fff;cursor:pointer}
button.secondary{background:#fff;color:#1f2124}header button{border-color:#fff}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:16px}
.card{background:#fff;border:1px solid #d6d9dc;border-radius:10px;padding:10px}.card.has-crop{border-color:#2f6fb5;box-shadow:0 0 0 2px #2f6fb5}
.shot{background:#fff;border:1px solid #e3e5e8;border-radius:6px;aspect-ratio:1;overflow:hidden;cursor:pointer}
.shot img,.shot canvas{width:100%;height:100%;display:block;object-fit:contain}
.meta{margin:8px 0 6px;font-weight:600}.sub{font-size:12px;color:#5a6066;margin-bottom:6px}.low{color:#a4580a;font-weight:600}
#overlay{position:fixed;inset:0;background:rgba(10,20,30,.88);display:none;z-index:10;flex-direction:column}
#overlay.open{display:flex}#bar{display:flex;gap:8px;padding:10px 16px;align-items:center;color:#fff}#bar span{flex:1}
#stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:12px}
#wrap{position:relative;line-height:0;user-select:none;touch-action:none}#wrap img{max-width:92vw;max-height:78vh;display:block;-webkit-user-drag:none;background:#fff}
#rect{position:absolute;border:2px solid #fff;outline:1px solid #000;background:rgba(85,132,181,.25);cursor:move;display:none}
.h{position:absolute;width:14px;height:14px;background:#fff;border:2px solid #000;border-radius:3px}
.h[data-d=nw]{left:-8px;top:-8px;cursor:nwse-resize}.h[data-d=ne]{right:-8px;top:-8px;cursor:nesw-resize}
.h[data-d=sw]{left:-8px;bottom:-8px;cursor:nesw-resize}.h[data-d=se]{right:-8px;bottom:-8px;cursor:nwse-resize}
.h[data-d=n]{left:calc(50% - 7px);top:-8px;cursor:ns-resize}.h[data-d=s]{left:calc(50% - 7px);bottom:-8px;cursor:ns-resize}
.h[data-d=w]{left:-8px;top:calc(50% - 7px);cursor:ew-resize}.h[data-d=e]{right:-8px;top:calc(50% - 7px);cursor:ew-resize}
</style></head><body>
<header><h1>Images des ordinateurs de plongée</h1><input id="q" placeholder="Filtrer (marque, modèle)"><span id="count"></span>
<button id="export">Exporter crops.json</button></header>
<div id="grid"></div>
<div id="overlay"><div id="bar"><span id="title"></span><button class="secondary" id="clear">Effacer le recadrage</button>
<button class="secondary" id="cancel">Annuler</button><button id="apply">Appliquer</button></div>
<div id="stage"><div id="wrap"><img id="big" alt=""><div id="rect"><i class="h" data-d="nw"></i><i class="h" data-d="n"></i><i class="h" data-d="ne"></i><i class="h" data-d="e"></i><i class="h" data-d="se"></i><i class="h" data-d="s"></i><i class="h" data-d="sw"></i><i class="h" data-d="w"></i></div></div></div></div>
<script>
const ITEMS=/*ITEMS*/[];
// The crops embedded at generation (crops.json), with this browser's changes on top (kept between visits).
const STORE='dc-images-crops';
const crops=Object.assign(/*CROPS*/{},JSON.parse(localStorage.getItem(STORE)||'{}'));
for(const k of Object.keys(crops))if(crops[k]===null)delete crops[k];
const local=JSON.parse(localStorage.getItem(STORE)||'{}');
const remember=(k,v)=>{local[k]=v;localStorage.setItem(STORE,JSON.stringify(local));};
const key=(i)=>i.vendor+'|'+i.product;
const grid=document.getElementById('grid');
// The image the card shows: with a manual crop, drawn here like build.mjs does (crop, fit inside 88 %, centred on
// white); without one, the normalized file build.mjs wrote (background trimmed).
const MARGIN=0.06,SIZE=512;
const originals={};
function loadOriginal(it){return originals[it.slug]||(originals[it.slug]=new Promise((ok,ko)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=ko;im.src=it.orig;}));}
async function drawCrop(canvas,it,c){
  const im=await loadOriginal(it);
  canvas.width=SIZE;canvas.height=SIZE;const g=canvas.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,SIZE,SIZE);
  const inner=SIZE*(1-2*MARGIN),s=Math.min(inner/c.w,inner/c.h),w=c.w*s,h=c.h*s;
  g.imageSmoothingQuality='high';g.drawImage(im,c.x,c.y,c.w,c.h,(SIZE-w)/2,(SIZE-h)/2,w,h);
}
function shot(it){
  const d=document.createElement('div');d.className='shot';d.title='Recadrer';d.onclick=()=>openCrop(it);
  const c=crops[key(it)];
  if(c){const cv=document.createElement('canvas');d.append(cv);drawCrop(cv,it,c);}
  else{const im=document.createElement('img');im.loading='lazy';im.src=it.norm+'?v='+Date.now();d.append(im);}
  return d;
}
function card(it){
  const c=document.createElement('div');c.className='card'+(crops[key(it)]?' has-crop':'');c.dataset.slug=it.slug;
  const m=document.createElement('div');m.className='meta';m.textContent=it.vendor+' '+it.product;
  const sub=document.createElement('div');sub.className='sub';
  const conf=document.createElement('span');conf.textContent=it.confidence;if(it.confidence==='low')conf.className='low';
  sub.append(conf,' · ',crops[key(it)]?'recadrage manuel':'recadrage auto');
  const b=document.createElement('button');b.className='secondary';b.textContent='Recadrer';b.onclick=()=>openCrop(it);
  c.append(shot(it),m,sub,b);return c;
}
// Only the card of the model just cropped is redrawn: the page keeps its place.
function refresh(it){const old=grid.querySelector('[data-slug="'+it.slug+'"]');if(old)old.replaceWith(card(it));count();}
function count(){document.getElementById('count').textContent=grid.children.length+' modèles · '+Object.keys(crops).length+' recadrés à la main';}
function render(){
  const q=document.getElementById('q').value.toLowerCase();grid.textContent='';
  for(const it of ITEMS){
    if(q&&!(it.vendor+' '+it.product).toLowerCase().includes(q))continue;
    grid.append(card(it));
  }
  count();
}
document.getElementById('q').oninput=render;
const ov=document.getElementById('overlay'),big=document.getElementById('big'),rect=document.getElementById('rect');
let cur=null,box=null;
function showRect(){rect.style.display='block';rect.style.left=box.x+'px';rect.style.top=box.y+'px';rect.style.width=box.w+'px';rect.style.height=box.h+'px';}
function openCrop(it){
  cur=it;box=null;rect.style.display='none';
  document.getElementById('title').textContent=it.vendor+' '+it.product+' : faites glisser un rectangle sur l’image';
  big.onload=()=>{const c=crops[key(it)];if(c){const k=big.clientWidth/big.naturalWidth;box={x:c.x*k,y:c.y*k,w:c.w*k,h:c.h*k};showRect();}};
  big.src=it.orig;ov.classList.add('open');if(big.complete&&big.naturalWidth)big.onload();
}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
let drag=null;
function pt(e){const r=big.getBoundingClientRect();return{x:clamp(e.clientX-r.left,0,r.width),y:clamp(e.clientY-r.top,0,r.height)};}
const wrap=document.getElementById('wrap');
wrap.addEventListener('pointerdown',(e)=>{
  const p=pt(e);const d=e.target.dataset&&e.target.dataset.d;
  if(d)drag={mode:d,start:p,box:{...box}};
  else if(e.target===rect)drag={mode:'move',start:p,box:{...box}};
  else{box={x:p.x,y:p.y,w:0,h:0};showRect();drag={mode:'new',start:p};}
  wrap.setPointerCapture(e.pointerId);e.preventDefault();
});
wrap.addEventListener('pointermove',(e)=>{
  if(!drag)return;const p=pt(e),W=big.clientWidth,H=big.clientHeight;
  if(drag.mode==='new'){box={x:Math.min(drag.start.x,p.x),y:Math.min(drag.start.y,p.y),w:Math.abs(p.x-drag.start.x),h:Math.abs(p.y-drag.start.y)};}
  else if(drag.mode==='move'){const b=drag.box;box={x:clamp(b.x+p.x-drag.start.x,0,W-b.w),y:clamp(b.y+p.y-drag.start.y,0,H-b.h),w:b.w,h:b.h};}
  else{const b=drag.box;let l=b.x,t=b.y,r=b.x+b.w,bt=b.y+b.h;
    if(drag.mode.includes('w'))l=Math.min(p.x,r-4);
    if(drag.mode.includes('e'))r=Math.max(p.x,l+4);
    if(drag.mode.includes('n'))t=Math.min(p.y,bt-4);
    if(drag.mode.includes('s'))bt=Math.max(p.y,t+4);
    box={x:l,y:t,w:r-l,h:bt-t};}
  showRect();
});
const end=()=>{drag=null;};
wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',end);
document.getElementById('cancel').onclick=()=>ov.classList.remove('open');
document.getElementById('clear').onclick=()=>{delete crops[key(cur)];remember(key(cur),null);ov.classList.remove('open');refresh(cur);};
document.getElementById('apply').onclick=()=>{
  if(!box||box.w<8||box.h<8){alert('Tracez d’abord un rectangle.');return;}
  const k=big.naturalWidth/big.clientWidth;
  crops[key(cur)]={x:Math.round(box.x*k),y:Math.round(box.y*k),w:Math.round(box.w*k),h:Math.round(box.h*k)};
  remember(key(cur),crops[key(cur)]);
  ov.classList.remove('open');refresh(cur);
};
document.getElementById('export').onclick=()=>{
  const sorted=Object.fromEntries(Object.keys(crops).sort().map((k)=>[k,crops[k]]));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(sorted,null,2)+'\n'],{type:'application/json'}));
  a.download='crops.json';a.click();
};
window.__test={crops,openCrop,ITEMS};
render();
</script></body></html>
